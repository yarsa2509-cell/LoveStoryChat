<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Love Story Chat</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f5f7fb;height:100vh}
.app{height:100vh;display:flex}
.sidebar{width:320px;background:white;border-right:1px solid #ddd;padding:20px}
.logo{font-size:24px;font-weight:bold;margin-bottom:20px}
.search{width:100%;padding:12px;border:1px solid #ddd;border-radius:20px}
.chatlist{margin-top:20px}
.person{padding:14px;border-radius:12px;background:#f1f3f6;margin-bottom:8px;cursor:pointer}
.chat{flex:1;display:flex;flex-direction:column}
.header{background:white;padding:16px 20px;border-bottom:1px solid #ddd;font-weight:bold}
.messages{flex:1;padding:20px;overflow:auto}
.msg{max-width:70%;padding:11px 15px;border-radius:18px;margin:8px 0}
.me{margin-left:auto;background:#6c63ff;color:white}
.them{background:white;border:1px solid #ddd}
.input{display:flex;padding:15px;background:white;border-top:1px solid #ddd}
.input input{flex:1;padding:13px;border:1px solid #ddd;border-radius:22px;outline:none}
.input button{margin-left:8px;border:0;border-radius:22px;padding:0 20px;background:#6c63ff;color:white}
@media(max-width:600px){.sidebar{width:90px;padding:10px}.logo{font-size:14px}.search{display:none}.person span{display:none}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
<div class="logo">❤️ Love Story</div>
<input class="search" placeholder="Search">
<div class="chatlist">
<div class="person">👤 <span>My Love</span></div>
<div class="person">👤 <span>Partner</span></div>
</div>
</aside>
<main class="chat">
<div class="header">❤️ My Love</div>
<div class="messages">
<div class="msg them">Hi ❤️</div>
<div class="msg me">Hello my love ❤️</div>
</div>
<div class="input">
<input placeholder="Type a message...">
<button>Send</button>
</div>
</main>
</div>
</body>
</html>
